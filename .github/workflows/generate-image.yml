name: 🎨 Generate AI Image
run-name: Generating - ${{ github.event.inputs.prompt }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Describe your image'
        required: true
        default: 'a boy jumping from airplane, cinematic, photorealistic, detailed face'
        type: string
      style:
        description: 'Image style'
        required: false
        default: 'photorealistic'
        type: choice
        options:
          - 'photorealistic'
          - 'anime'
          - 'artistic'
      steps:
        description: 'Quality (1=fastest, 4=best)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'

jobs:
  generate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Cache Python PIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-v2-${{ runner.os }}-
      
      - name: 📦 Cache Models PERMANENTLY
        uses: actions/cache@v4
        id: model-cache
        with:
          path: |
            ~/.cache/huggingface
            /home/runner/.cache/huggingface
          key: model-v5-${{ runner.os }}
          restore-keys: model-v5-${{ runner.os }}
      
      - name: 📚 Install Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors pillow huggingface_hub
      
      - name: 🎯 Generate Image
        env:
          HF_HOME: /home/runner/.cache/huggingface
          TRANSFORMERS_CACHE: /home/runner/.cache/huggingface
        run: |
          python generate.py \
            --prompt "${{ github.event.inputs.prompt }}" \
            --style "${{ github.event.inputs.style }}" \
            --steps ${{ github.event.inputs.steps }}
      
      - name: 📤 Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: output.png
          retention-days: 7
