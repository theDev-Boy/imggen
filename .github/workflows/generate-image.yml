name: 🎨 AI Image Generator

on:
  workflow_dispatch:
    inputs:
      count:
        description: '📸 How many images?'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      
      prompt1:
        description: '📝 Prompt for Image 1'
        required: true
        default: 'a boy skydiving from airplane, photorealistic, detailed, cinematic'
        type: string
      
      prompt2:
        description: '📝 Prompt for Image 2'
        required: false
        default: ''
        type: string
      
      prompt3:
        description: '📝 Prompt for Image 3'
        required: false
        default: ''
        type: string
      
      prompt4:
        description: '📝 Prompt for Image 4'
        required: false
        default: ''
        type: string
      
      prompt5:
        description: '📝 Prompt for Image 5'
        required: false
        default: ''
        type: string
      
      steps:
        description: '⚡ Speed vs Quality'
        required: true
        default: 'fast'
        type: choice
        options:
          - 'fast'
          - 'balanced'
          - 'quality'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: fast-model-v2-${{ runner.os }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors pillow
      
      - name: Generate Images
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: 1
        run: |
          python generate.py --count ${{ github.event.inputs.count }} --steps ${{ github.event.inputs.steps }} --p1 "${{ github.event.inputs.prompt1 }}" --p2 "${{ github.event.inputs.prompt2 }}" --p3 "${{ github.event.inputs.prompt3 }}" --p4 "${{ github.event.inputs.prompt4 }}" --p5 "${{ github.event.inputs.prompt5 }}"
      
      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: ai-images
          path: output_*.png
          retention-days: 7
