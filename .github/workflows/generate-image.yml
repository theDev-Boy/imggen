name: 🎨 Generate AI Image
run-name: Generating image - ${{ github.event.inputs.prompt }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What image do you want?'
        required: true
        default: 'boy jumping from airplane, cinematic lighting, dramatic sky'
        type: string
      steps:
        description: 'Number of inference steps (4-8 for LCM, higher = better but slower)'
        required: false
        default: '4'
        type: choice
        options:
          - '4'
          - '6'
          - '8'
      seed:
        description: 'Random seed (leave empty for random)'
        required: false
        default: ''
        type: string

jobs:
  generate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Cache Model Files
        uses: actions/cache@v4
        id: cache-models
        with:
          path: ~/.cache/huggingface
          key: lcm-sd15-model-v3
          restore-keys: |
            lcm-sd15-model-
      
      - name: 📚 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade huggingface_hub
          pip install diffusers transformers accelerate safetensors pillow
      
      - name: 🎯 Generate Image
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: 1
          HF_HUB_ENABLE_HF_TRANSFER: 0
        run: |
          python generate.py "${{ github.event.inputs.prompt }}" \
            --steps ${{ github.event.inputs.steps }} \
            ${{ github.event.inputs.seed != '' && format('--seed {0}', github.event.inputs.seed) || '' }}
      
      - name: 📤 Upload Generated Image
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: |
            output.png
            generation-info.txt
          retention-days: 7
      
      - name: 🎉 Show Image Info
        run: |
          echo "✅ Image generated successfully!"
          echo "📝 Prompt: ${{ github.event.inputs.prompt }}"
          echo "⏱️ Check 'generation-info.txt' for timing details"
          ls -lh output.png
